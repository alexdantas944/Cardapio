<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a1707">
<title>Sonho de Pastel | Cardápio & Checkout</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brown:#481607;--brown2:#70260b;--yellow:#ffc400;--orange:#ff8b00;--cream:#fff8e8;--line:#eadcc9;--muted:#786c61;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#28180e;font-family:Inter,system-ui,Arial,sans-serif}
button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brown),#260a03);color:#fff;box-shadow:0 5px 18px #0003}
.topin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:15px;object-fit:cover}.brand b{display:block;font-size:19px}.brand small{opacity:.75}
.cart{margin-left:auto;border:0;border-radius:999px;padding:11px 15px;background:var(--yellow);color:var(--brown);font-weight:900;cursor:pointer}.badge{display:inline-grid;place-items:center;background:var(--brown);color:#fff;border-radius:50%;min-width:23px;height:23px}
.hero{background:linear-gradient(135deg,#fff0a7,#fffaf0);padding:28px 16px}.hero-in{max-width:1180px;margin:auto;display:grid;grid-template-columns:130px 1fr;gap:22px;align-items:center}.hero img{width:130px;height:130px;object-fit:contain}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1;margin:0 0 10px;color:var(--brown)}.hero p{margin:0 0 15px;color:#654e3e}.search{width:min(650px,100%);padding:13px 17px;border-radius:999px;border:1px solid var(--line);outline:none}
.cats{background:#fff;position:sticky;top:74px;z-index:10;border-bottom:1px solid var(--line);overflow:auto}.cats-in{max-width:1180px;margin:auto;padding:9px 16px;display:flex;gap:8px}.cat{border:1px solid var(--line);background:#fff9f0;color:var(--brown);border-radius:999px;padding:8px 13px;font-weight:800;white-space:nowrap}.cat.on{background:var(--brown);color:#fff}
main{max-width:1180px;margin:auto;padding:24px 16px 120px}.status{text-align:center;padding:30px;color:var(--muted)}.section{margin-bottom:28px}.section h2{color:var(--brown);font-size:23px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 25px #4a170712}.photo{height:210px;background:#f7ead6;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;top:11px;left:11px;background:var(--yellow);color:var(--brown);font-size:12px;font-weight:900;padding:6px 9px;border-radius:999px}.body{padding:14px;display:flex;flex-direction:column;min-height:165px}.body h3{margin:0 0 6px}.desc{color:var(--muted);font-size:14px;line-height:1.4;min-height:40px}.prodrow{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-size:19px;font-weight:950;color:var(--brown)}.add{border:0;background:var(--brown);color:#fff;border-radius:11px;padding:10px 13px;font-weight:900;cursor:pointer}
.overlay{position:fixed;inset:0;background:#0008;z-index:50;display:none}.overlay.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(480px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-10px 0 40px #0003}.head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;color:var(--brown)}.close{border:0;border-radius:50%;width:38px;height:38px;background:#f4eee6;cursor:pointer}.steps{display:flex;padding:12px 15px;gap:6px;background:#fffaf3;border-bottom:1px solid var(--line)}.step{flex:1;text-align:center;font-size:11px;font-weight:900;color:#9b8b7b}.step.active{color:var(--brown)}.pane{display:none;flex:1;overflow:auto;padding:15px}.pane.active{display:block}.cartitem{display:grid;grid-template-columns:58px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid #f0e7db;align-items:center}.cartitem img{width:58px;height:58px;object-fit:cover;border-radius:12px}.cartitem b{font-size:14px}.qty{display:flex;gap:6px;align-items:center;margin-top:5px}.qty button{width:27px;height:27px;border:1px solid var(--line);border-radius:8px;background:#fff}.rightprice{font-weight:900;color:var(--brown)}.field{margin-bottom:10px}.field label{font-size:12px;font-weight:900;color:#5c4a3c;display:block;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none;background:#fff}.delivery{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer}.choice.selected{border:2px solid var(--brown);background:#fff8eb}.choice input{accent-color:var(--brown)}.summary{background:#fff8ee;border-radius:14px;padding:13px;margin-top:12px}.line{display:flex;justify-content:space-between;margin:6px 0}.grand{font-size:21px;font-weight:950;color:var(--brown);border-top:1px solid var(--line);padding-top:9px}.bottom{border-top:1px solid var(--line);padding:13px 15px;background:#fff}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:950;cursor:pointer}.primary{background:var(--brown);color:#fff}.whats{background:var(--green);color:#fff;margin-top:8px}.back{background:#f2eadf;color:var(--brown);margin-top:8px}.success{text-align:center;padding:28px 8px}.success .icon{font-size:55px}.ordercode{font-size:22px;font-weight:950;color:var(--brown);margin:8px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.hero-in{grid-template-columns:78px 1fr;gap:12px}.hero img{width:78px;height:78px}.hero h1{font-size:25px}.grid{grid-template-columns:1fr 1fr;gap:10px}.photo{height:145px}.body{padding:11px;min-height:160px}.body h3{font-size:16px}.desc{font-size:12px}.price{font-size:17px}.add{padding:9px 10px}.brand b{font-size:16px}.logo{width:46px;height:46px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.photo{height:190px}}
</style>
</head>
<body>
<header class="top"><div class="topin">
<img class="logo" src="logo.png"><div class="brand"><b>Sonho de Pastel</b><small>Cardápio oficial</small></div>
<button class="cart" onclick="openCart()">🛒 Carrinho <span class="badge" id="count">0</span></button>
</div></header>

<section class="hero"><div class="hero-in"><img src="logo.png"><div>
<h1>Peça seu pastel 😋</h1><p>Monte seu pedido e finalize em poucos passos.</p>
<input class="search" id="search" oninput="render()" placeholder="🔎 Buscar produto...">
</div></div></section>
<nav class="cats"><div class="cats-in" id="cats"></div></nav>
<main><div class="status" id="status">Carregando cardápio...</div><div id="menu"></div></main>

<div class="overlay" id="overlay" onclick="outside(event)">
<aside class="drawer">
<div class="head"><h2 id="drawerTitle">🛒 Seu pedido</h2><button class="close" onclick="closeCart()">✕</button></div>
<div class="steps"><div class="step active" id="s1">1. ITENS</div><div class="step" id="s2">2. DADOS</div><div class="step" id="s3">3. REVISÃO</div></div>

<section class="pane active" id="pane1"><div id="cartList"></div></section>
<section class="pane" id="pane2">
<div class="field"><label>NOME</label><input id="name" placeholder="Como podemos te chamar?"></div>
<div class="field"><label>TELEFONE</label><input id="phone" inputmode="tel" placeholder="(85) 994530854"></div>
<div class="field"><label>TIPO DO PEDIDO</label><div class="delivery">
<label class="choice selected"><input type="radio" name="type" value="Entrega" checked onchange="calc()"> 🛵 Entrega</label>
<label class="choice"><input type="radio" name="type" value="Retirada" onchange="calc()"> 🏪 Retirada</label>
</div></div>
<div id="addressBox">
<div class="field"><label>ENDEREÇO</label><input id="address" placeholder="Rua, número, bairro"></div>
<div class="field"><label>COMPLEMENTO</label><input id="complement" placeholder="Apartamento, ponto de referência..."></div>
</div>
<div class="field"><label>PAGAMENTO</label><select id="payment"><option>PIX</option><option>Dinheiro</option><option>Cartão</option></select></div>
<div class="field"><label>OBSERVAÇÃO</label><textarea id="obs" rows="3" placeholder="Sem cebola, molho à parte..."></textarea></div>
</section>

<section class="pane" id="pane3">
<div id="review"></div>
<div class="summary"><div class="line"><span>Subtotal</span><b id="subtotal">R$ 0,00</b></div><div class="line"><span>Entrega</span><b id="deliveryFee">R$ 0,00</b></div><div class="line grand"><span>Total</span><span id="grand">R$ 0,00</span></div></div>
</section>

<div class="bottom">
<button class="btn primary" id="nextBtn" onclick="nextStep()">Continuar</button>
<button class="btn back" id="backBtn" style="display:none" onclick="prevStep()">Voltar</button>
<button class="btn whats" id="whatsBtn" style="display:none" onclick="finish()">📲 Confirmar e enviar no WhatsApp</button>
</div>
</aside></div>

<script>
const CONFIG={
 SUPABASE_URL:"https://htkqxttctkygzxubjhjy.supabase.co",
 SUPABASE_ANON_KEY:"sb_publishable_PvIjt7O1XsDIr1rs4fj99w_wcpcSA7L",
 TABLE:"produtos", BUCKET:"produtos",
 ORDERS_TABLE:"pedidos",
 WHATSAPP:"5585994530854",
 DELIVERY_FEE:5.00
};
let sb=null, products=[], cart=[], cat="Todos", step=1, orderCode="";
const $=id=>document.getElementById(id);
const money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function img(p){return p.imagem_url||((sb&&p.imagem)?sb.storage.from(CONFIG.BUCKET).getPublicUrl(p.imagem).data.publicUrl:"logo.png")}
async function load(){
 if(CONFIG.SUPABASE_URL.includes("COLE_AQUI")){
   $("status").innerHTML="⚙️ Configure as credenciais do Supabase no arquivo <b>index.html</b>.";
   return;
 }
 sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
 const r=await sb.from(CONFIG.TABLE).select("*").eq("ativo",true).order("ordem",{ascending:true});
 if(r.error){$("status").textContent="Erro ao carregar o cardápio. Verifique tabela e RLS.";console.error(r.error);return}
 products=r.data||[];$("status").style.display="none";renderCats();render();
}
function renderCats(){let cs=["Todos",...new Set(products.map(p=>p.categoria||"Outros"))];$("cats").innerHTML=cs.map(c=>`<button class="cat ${c===cat?"on":""}" onclick="setCat(${JSON.stringify(c)})">${esc(c)}</button>`).join("")}
function setCat(c){cat=c;renderCats();render()}
function render(){
 let q=($("search").value||"").toLowerCase(), arr=products.filter(p=>(cat==="Todos"||(p.categoria||"Outros")===cat)&&(!q||`${p.nome} ${p.descricao||""}`.toLowerCase().includes(q)));
 let groups={};arr.forEach(p=>(groups[p.categoria||"Outros"]??=[]).push(p));
 $("menu").innerHTML=Object.keys(groups).length?Object.entries(groups).map(([c,a])=>`<section class="section"><h2>${esc(c)}</h2><div class="grid">${a.map(card).join("")}</div></section>`).join(""):`<div class="status">Nenhum produto encontrado.</div>`;
}
function card(p){return `<article class="card"><div class="photo"><img loading="lazy" src="${esc(img(p))}" onerror="this.src='logo.png'">${p.destaque?'<span class="tag">⭐ Destaque</span>':''}</div><div class="body"><h3>${esc(p.nome)}</h3><div class="desc">${esc(p.descricao||"Preparado com carinho.")}</div><div class="prodrow"><span class="price">${money(p.preco)}</span><button class="add" onclick="add('${String(p.id).replace(/'/g,"\\'")}')">+ Adicionar</button></div></div></article>`}
function add(id){let p=products.find(x=>String(x.id)===id);if(!p)return;let x=cart.find(x=>String(x.id)===id);x?x.qty++:cart.push({...p,qty:1});updateCart();openCart()}
function change(id,d){let i=cart.findIndex(x=>String(x.id)===id);if(i<0)return;cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCart()}
function subtotal(){return cart.reduce((s,x)=>s+x.qty*Number(x.preco),0)}
function fee(){return document.querySelector('input[name="type"]:checked')?.value==="Entrega"&&cart.length?CONFIG.DELIVERY_FEE:0}
function calc(){$("deliveryFee").textContent=money(fee());$("subtotal").textContent=money(subtotal());$("grand").textContent=money(subtotal()+fee());updateChoices()}
function updateChoices(){document.querySelectorAll(".choice").forEach(x=>x.classList.toggle("selected",x.querySelector("input").checked))}
function updateCart(){
 $("count").textContent=cart.reduce((s,x)=>s+x.qty,0);
 $("cartList").innerHTML=cart.length?cart.map(x=>`<div class="cartitem"><img src="${esc(img(x))}" onerror="this.src='logo.png'"><div><b>${esc(x.nome)}</b><div class="qty"><button onclick="change('${x.id}',-1)">−</button><span>${x.qty}</span><button onclick="change('${x.id}',1)">+</button></div></div><span class="rightprice">${money(x.qty*Number(x.preco))}</span></div>`).join(""):`<div class="status">Seu carrinho está vazio 😋</div>`;
 calc();
}
function openCart(){if(!cart.length){alert("Adicione um produto ao carrinho.");return}step=1;showStep();$("overlay").classList.add("open")}
function closeCart(){$("overlay").classList.remove("open")}
function outside(e){if(e.target===$("overlay"))closeCart()}
function showStep(){
 [1,2,3].forEach(n=>{$("pane"+n).classList.toggle("active",n===step);$("s"+n).classList.toggle("active",n===step)});
 $("nextBtn").style.display=step<3?"block":"none";$("backBtn").style.display=step>1?"block":"none";$("whatsBtn").style.display=step===3?"block":"none";
 if(step===3)buildReview();calc();
}
function nextStep(){
 if(step===1){step=2;showStep();return}
 if(step===2){if(!validate())return;step=3;showStep();return}
}
function prevStep(){if(step>1){step--;showStep()}}
function validate(){
 if(!$("name").value.trim()){alert("Informe seu nome.");$("name").focus();return false}
 if(!$("phone").value.trim()){alert("Informe seu telefone.");$("phone").focus();return false}
 let type=document.querySelector('input[name="type"]:checked').value;
 if(type==="Entrega"&&!$("address").value.trim()){alert("Informe o endereço de entrega.");$("address").focus();return false}
 return true;
}
function buildReview(){
 let type=document.querySelector('input[name="type"]:checked').value;
 $("review").innerHTML=`<h3 style="color:var(--brown)">Confira seu pedido</h3><p><b>Cliente:</b> ${esc($("name").value)}<br><b>Telefone:</b> ${esc($("phone").value)}<br><b>Tipo:</b> ${type}${type==="Entrega"?`<br><b>Endereço:</b> ${esc($("address").value)} ${esc($("complement").value)}`:""}<br><b>Pagamento:</b> ${esc($("payment").value)}</p><hr>${cart.map(x=>`<div class="line"><span>${x.qty}x ${esc(x.nome)}</span><b>${money(x.qty*Number(x.preco))}</b></div>`).join("")}`;
}
async function saveOrder(){
 if(!sb)return {id:null};
 let type=document.querySelector('input[name="type"]:checked').value;
 let payload={cliente_nome:$("name").value.trim(),telefone:$("phone").value.trim(),tipo_pedido:type,endereco:type==="Entrega"?$("address").value.trim():null,complemento:$("complement").value.trim()||null,pagamento:$("payment").value,observacao:$("obs").value.trim()||null,itens:cart.map(x=>({produto_id:x.id,nome:x.nome,quantidade:x.qty,preco:Number(x.preco)})),subtotal:subtotal(),taxa_entrega:fee(),total:subtotal()+fee(),status:"novo"};
 let r=await sb.from(CONFIG.ORDERS_TABLE).insert(payload).select("id").single();
 if(r.error){console.warn("Pedido não salvo no Supabase:",r.error);return {id:null}}
 return {id:r.data?.id};
}
async function finish(){
 if(!validate())return;
 $("whatsBtn").disabled=true;$("whatsBtn").textContent="Enviando...";
 let saved=await saveOrder();orderCode=saved.id||("SP-"+Date.now().toString().slice(-6));
 let type=document.querySelector('input[name="type"]:checked').value,total=subtotal()+fee();
 let msg=`*NOVO PEDIDO — SONHO DE PASTEL*%0A*Pedido:* ${encodeURIComponent(orderCode)}%0A%0A*Cliente:* ${encodeURIComponent($("name").value)}%0A*Telefone:* ${encodeURIComponent($("phone").value)}%0A*Tipo:* ${encodeURIComponent(type)}%0A`;
 if(type==="Entrega")msg+=`*Endereço:* ${encodeURIComponent($("address").value)}%0A*Complemento:* ${encodeURIComponent($("complement").value)}%0A`;
 msg+=`*Pagamento:* ${encodeURIComponent($("payment").value)}%0A%0A*ITENS:*%0A`;
 cart.forEach(x=>msg+=`• ${x.qty}x ${encodeURIComponent(x.nome)} — ${encodeURIComponent(money(x.qty*Number(x.preco)))}%0A`);
 msg+=`%0A*Subtotal:* ${encodeURIComponent(money(subtotal()))}%0A*Entrega:* ${encodeURIComponent(money(fee()))}%0A*TOTAL:* ${encodeURIComponent(money(total))}%0A`;
 if($("obs").value.trim())msg+=`*Obs:* ${encodeURIComponent($("obs").value.trim())}`;
 window.open(`https://wa.me/${CONFIG.WHATSAPP}?text=${msg}`,"_blank");
 $("whatsBtn").disabled=false;$("whatsBtn").textContent="📲 Confirmar e enviar no WhatsApp";
}
updateCart();load();
</script>
</body></html>
