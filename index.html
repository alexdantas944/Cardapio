<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4a1707"><meta name="description" content="Cardápio Sonho de Pastel">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png">
<title>Sonho de Pastel | Cardápio</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--b:#481607;--y:#ffc400;--c:#fff8e8;--m:#76695e;--l:#eadccb;--g:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--c);color:#28180e;font-family:system-ui,-apple-system,Segoe UI,Arial}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#481607,#260a03);color:#fff;box-shadow:0 5px 20px #0003}.topin{max-width:1180px;margin:auto;padding:9px 16px;display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;object-fit:cover;border-radius:15px}.brand b{display:block;font-size:19px}.brand small{opacity:.72}.cart{margin-left:auto;border:0;border-radius:999px;padding:11px 15px;background:var(--y);color:var(--b);font-weight:950}.badge{display:inline-grid;place-items:center;min-width:23px;height:23px;background:var(--b);color:#fff;border-radius:50%}.hero{background:linear-gradient(135deg,#fff0a7,#fffaf1);padding:30px 16px}.hero-in{max-width:1180px;margin:auto;display:grid;grid-template-columns:135px 1fr;gap:23px;align-items:center}.hero img{width:135px;height:135px;object-fit:contain}.hero h1{font-size:clamp(30px,5vw,48px);line-height:1;margin:0 0 10px;color:var(--b)}.hero p{margin:0 0 15px;color:#654e3e}.search{width:min(700px,100%);padding:14px 18px;border:1px solid var(--l);border-radius:999px;outline:none}.cats{position:sticky;top:70px;z-index:20;background:#fff;border-bottom:1px solid var(--l);overflow:auto}.cats-in{max-width:1180px;margin:auto;padding:9px 16px;display:flex;gap:8px}.cat{border:1px solid var(--l);background:#fff9f0;color:var(--b);border-radius:999px;padding:8px 14px;font-weight:850;white-space:nowrap}.cat.on{background:var(--b);color:#fff}main{max-width:1180px;margin:auto;padding:24px 16px 110px}.status{text-align:center;padding:32px;color:var(--m)}.section{margin-bottom:30px}.section h2{color:var(--b);font-size:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid var(--l);border-radius:21px;overflow:hidden;box-shadow:0 12px 34px #4a170714}.photo{height:215px;background:#f7ead6;position:relative}.photo img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:11px;top:11px;background:var(--y);color:var(--b);padding:6px 9px;border-radius:999px;font-size:12px;font-weight:950}.body{padding:14px;display:flex;flex-direction:column;min-height:175px}.body h3{margin:0 0 6px}.desc{font-size:14px;line-height:1.4;color:var(--m);min-height:40px}.prodrow{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-size:20px;font-weight:950;color:var(--b)}.add{border:0;background:var(--b);color:#fff;border-radius:11px;padding:10px 13px;font-weight:950}.fab{position:fixed;right:17px;bottom:17px;z-index:25;border:0;background:var(--g);color:#fff;border-radius:999px;padding:13px 17px;font-weight:950;box-shadow:0 8px 25px #0004;display:none}.fab.show{display:block}.overlay{position:fixed;inset:0;background:#0008;z-index:60;display:none}.overlay.open{display:block}.drawer{position:absolute;right:0;top:0;height:100%;width:min(500px,100%);background:#fff;display:flex;flex-direction:column}.head{padding:14px 17px;border-bottom:1px solid var(--l);display:flex;justify-content:space-between;align-items:center}.head h2{margin:0;color:var(--b)}.close{border:0;border-radius:50%;width:38px;height:38px;background:#f4eee6}.steps{display:flex;padding:11px 15px;gap:6px;background:#fffaf4;border-bottom:1px solid var(--l)}.step{flex:1;text-align:center;font-size:10px;font-weight:950;color:#a09386}.step.active{color:var(--b)}.pane{display:none;flex:1;overflow:auto;padding:15px}.pane.active{display:block}.item{display:grid;grid-template-columns:58px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f0e7dc}.item img{width:58px;height:58px;border-radius:12px;object-fit:cover}.item b{font-size:14px}.qty{display:flex;align-items:center;gap:6px;margin-top:5px}.qty button{width:27px;height:27px;border:1px solid var(--l);background:#fff;border-radius:8px}.rprice{font-weight:950;color:var(--b)}.field{margin-bottom:11px}.field label{display:block;font-size:11px;font-weight:950;color:#5e4b3c;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--l);border-radius:12px;outline:none}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--l);border-radius:12px;padding:11px;font-weight:800}.choice.selected{border:2px solid var(--b);background:#fff8eb}.summary{background:#fff8ee;border-radius:14px;padding:13px;margin-top:12px}.line{display:flex;justify-content:space-between;margin:6px 0}.grand{border-top:1px solid var(--l);padding-top:9px;font-size:21px;font-weight:950;color:var(--b)}.bottom{border-top:1px solid var(--l);padding:12px 15px;background:#fff}.btn{width:100%;border:0;border-radius:12px;padding:13px;font-weight:950}.primary{background:var(--b);color:#fff}.back{background:#f2eadf;color:var(--b);margin-top:7px}.whats{background:var(--g);color:#fff;margin-top:7px}.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:#24140c;color:#fff;padding:11px 15px;border-radius:999px;opacity:0;z-index:100;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.hero-in{grid-template-columns:78px 1fr;gap:12px}.hero img{width:78px;height:78px}.hero h1{font-size:26px}.grid{grid-template-columns:1fr 1fr;gap:10px}.photo{height:150px}.body{padding:11px;min-height:165px}.body h3{font-size:16px}.desc{font-size:12px}.price{font-size:17px}.add{padding:9px 10px}.logo{width:46px;height:46px}.brand b{font-size:16px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.photo{height:190px}}
</style></head><body>
<header class="top"><div class="topin"><img class="logo" src="logo.png"><div class="brand"><b>Sonho de Pastel</b><small>Cardápio oficial • Pedido pelo WhatsApp</small></div><button class="cart" onclick="openCart()">🛒 Carrinho <span class="badge" id="count">0</span></button></div></header>
<section class="hero"><div class="hero-in"><img src="logo.png"><div><h1>Seu pastel favorito 😋</h1><p>Escolha seus produtos e finalize em poucos passos.</p><input id="search" class="search" placeholder="🔎 Buscar no cardápio..." oninput="render()"></div></div></section>
<nav class="cats"><div class="cats-in" id="cats"></div></nav><main><div class="status" id="status">Carregando cardápio...</div><div id="menu"></div></main>
<button class="fab" id="fab" onclick="openCart()">🛒 Ver pedido · <span id="fabTotal">R$ 0,00</span></button>
<div class="overlay" id="overlay" onclick="outside(event)"><aside class="drawer">
<div class="head"><h2>🛒 Finalizar pedido</h2><button class="close" onclick="closeCart()">✕</button></div>
<div class="steps"><div class="step active" id="s1">1. ITENS</div><div class="step" id="s2">2. DADOS</div><div class="step" id="s3">3. REVISÃO</div></div>
<section class="pane active" id="pane1"><div id="cartList"></div></section>
<section class="pane" id="pane2">
<div class="field"><label>NOME</label><input id="name" autocomplete="name" placeholder="Seu nome"></div>
<div class="field"><label>TELEFONE</label><input id="phone" autocomplete="tel" inputmode="tel" placeholder="(85) 99999-9999"></div>
<div class="field"><label>COMO VAI RECEBER?</label><div class="choices"><label class="choice selected"><input type="radio" name="type" value="Entrega" checked onchange="calc()"> 🛵 Entrega</label><label class="choice"><input type="radio" name="type" value="Retirada" onchange="calc()"> 🏪 Retirada</label></div></div>
<div id="addressBox"><div class="field"><label>ENDEREÇO</label><input id="address" autocomplete="street-address" placeholder="Rua, número, bairro"></div><div class="field"><label>COMPLEMENTO</label><input id="complement" placeholder="Apartamento, ponto de referência"></div></div>
<div class="field"><label>PAGAMENTO</label><select id="payment"><option>PIX</option><option>Dinheiro</option><option>Cartão</option></select></div>
<div class="field"><label>OBSERVAÇÃO</label><textarea id="obs" rows="3" placeholder="Ex.: sem cebola, molho à parte..."></textarea></div>
</section>
<section class="pane" id="pane3"><div id="review"></div><div class="summary"><div class="line"><span>Subtotal</span><b id="subtotal">R$ 0,00</b></div><div class="line"><span>Entrega</span><b id="delivery">R$ 0,00</b></div><div class="line grand"><span>Total</span><span id="total">R$ 0,00</span></div></div></section>
<div class="bottom"><button class="btn primary" id="next" onclick="next()">Continuar</button><button class="btn back" id="back" style="display:none" onclick="back()">Voltar</button><button class="btn whats" id="send" style="display:none" onclick="finish()">📲 Confirmar e enviar no WhatsApp</button></div>
</aside></div><div class="toast" id="toast"></div>
<script>
const CONFIG={SUPABASE_URL:"https://htkqxttctkygzxubjhjy.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_PvIjt7O1XsDIr1rs4fj99w_wcpcSA7L",TABLE:"produtos",BUCKET:"produtos",ORDERS_TABLE:"pedidos",WHATSAPP:"5585994530854",DELIVERY_FEE:5};
let sb=null,products=[],cart=[],cat="Todos",step=1;
const $=x=>document.getElementById(x),money=v=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v)||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function img(p){return p.imagem_url||((sb&&p.imagem)?sb.storage.from(CONFIG.BUCKET).getPublicUrl(p.imagem).data.publicUrl:"logo.png")}
async function load(){if(CONFIG.SUPABASE_URL.includes("COLE_AQUI")){$("status").innerHTML="⚙️ Configure SUPABASE_URL e SUPABASE_ANON_KEY no index.html.";return}sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);let r=await sb.from(CONFIG.TABLE).select("*").eq("ativo",true).order("ordem",{ascending:true});if(r.error){$("status").textContent="Erro ao carregar o cardápio. Confira tabela/RLS.";return}products=r.data||[];$("status").style.display="none";cats();render()}
function cats(){let a=["Todos",...new Set(products.map(p=>p.categoria||"Outros"))];$("cats").innerHTML=a.map(c=>`<button class="cat ${c===cat?"on":""}" onclick="setcat(${JSON.stringify(c)})">${esc(c)}</button>`).join("")}
function setcat(c){cat=c;cats();render()}
function render(){let q=($("search").value||"").toLowerCase().trim(),a=products.filter(p=>(cat==="Todos"||(p.categoria||"Outros")===cat)&&(!q||`${p.nome} ${p.descricao||""}`.toLowerCase().includes(q))),g={};a.forEach(p=>(g[p.categoria||"Outros"]??=[]).push(p));$("menu").innerHTML=Object.keys(g).length?Object.entries(g).map(([c,a])=>`<section class="section"><h2>${esc(c)}</h2><div class="grid">${a.map(card).join("")}</div></section>`).join(""):`<div class="status">😕 Nenhum produto encontrado.</div>`}
function card(p){return `<article class="card"><div class="photo"><img loading="lazy" src="${esc(img(p))}" alt="${esc(p.nome)}" onerror="this.src='logo.png'">${p.destaque?'<span class="tag">⭐ Destaque</span>':''}</div><div class="body"><h3>${esc(p.nome)}</h3><div class="desc">${esc(p.descricao||"Preparado com carinho.")}</div><div class="prodrow"><span class="price">${money(p.preco)}</span><button class="add" onclick="add('${String(p.id).replace(/'/g,"\\'")}')">+ Adicionar</button></div></div></article>`}
function add(id){let p=products.find(x=>String(x.id)===id);if(!p)return;let x=cart.find(x=>String(x.id)===id);x?x.qty++:cart.push({...p,qty:1});update();toast("Adicionado ao carrinho")}
function change(id,d){let i=cart.findIndex(x=>String(x.id)===id);if(i<0)return;cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);update()}
function sub(){return cart.reduce((s,x)=>s+x.qty*Number(x.preco),0)}function fee(){return document.querySelector('input[name="type"]:checked')?.value==="Entrega"&&cart.length?CONFIG.DELIVERY_FEE:0}
function update(){$("count").textContent=cart.reduce((s,x)=>s+x.qty,0);$("fabTotal").textContent=money(sub()+fee());$("fab").classList.toggle("show",cart.length>0);$("cartList").innerHTML=cart.length?cart.map(x=>`<div class="item"><img src="${esc(img(x))}" onerror="this.src='logo.png'"><div><b>${esc(x.nome)}</b><div class="qty"><button onclick="change('${x.id}',-1)">−</button><span>${x.qty}</span><button onclick="change('${x.id}',1)">+</button></div></div><span class="rprice">${money(x.qty*Number(x.preco))}</span></div>`).join(""):`<div class="status">Seu carrinho está vazio 😋</div>`;calc()}
function calc(){$("subtotal").textContent=money(sub());$("delivery").textContent=money(fee());$("total").textContent=money(sub()+fee());document.querySelectorAll(".choice").forEach(x=>x.classList.toggle("selected",x.querySelector("input").checked));$("addressBox").style.display=document.querySelector('input[name="type"]:checked')?.value==="Entrega"?"block":"none"}
function openCart(){if(!cart.length){toast("Adicione um produto primeiro.");return}step=1;show();$("overlay").classList.add("open")}function closeCart(){$("overlay").classList.remove("open")}function outside(e){if(e.target===$("overlay"))closeCart()}
function show(){[1,2,3].forEach(n=>{$("pane"+n).classList.toggle("active",n===step);$("s"+n).classList.toggle("active",n===step)});$("next").style.display=step<3?"block":"none";$("back").style.display=step>1?"block":"none";$("send").style.display=step===3?"block":"none";if(step===3)review();calc()}
function next(){if(step===1){step=2;show()}else if(step===2&&validate()){step=3;show()}}function back(){if(step>1){step--;show()}}
function validate(){if(!$("name").value.trim()){toast("Informe seu nome.");return false}if(!$("phone").value.trim()){toast("Informe seu telefone.");return false}if(document.querySelector('input[name="type"]:checked').value==="Entrega"&&!$("address").value.trim()){toast("Informe o endereço.");return false}return true}
function review(){let t=document.querySelector('input[name="type"]:checked').value;$("review").innerHTML=`<h3 style="color:var(--b)">Confira seu pedido</h3><p><b>Cliente:</b> ${esc($("name").value)}<br><b>Telefone:</b> ${esc($("phone").value)}<br><b>Tipo:</b> ${t}${t==="Entrega"?`<br><b>Endereço:</b> ${esc($("address").value)}<br><b>Complemento:</b> ${esc($("complement").value)}`:""}<br><b>Pagamento:</b> ${esc($("payment").value)}</p><hr>${cart.map(x=>`<div class="line"><span>${x.qty}x ${esc(x.nome)}</span><b>${money(x.qty*Number(x.preco))}</b></div>`).join("")}`}
async function save(){if(!sb)return null;let t=document.querySelector('input[name="type"]:checked').value,p={cliente_nome:$("name").value.trim(),telefone:$("phone").value.trim(),tipo_pedido:t,endereco:t==="Entrega"?$("address").value.trim():null,complemento:$("complement").value.trim()||null,pagamento:$("payment").value,observacao:$("obs").value.trim()||null,itens:cart.map(x=>({produto_id:x.id,nome:x.nome,quantidade:x.qty,preco:Number(x.preco)})),subtotal:sub(),taxa_entrega:fee(),total:sub()+fee(),status:"novo"};let r=await sb.from(CONFIG.ORDERS_TABLE).insert(p).select("id").single();return r.error?null:r.data?.id}
async function finish(){if(!validate())return;$("send").disabled=true;$("send").textContent="Preparando pedido...";let id=await save(),code=id||("SP-"+Date.now().toString().slice(-6)),t=document.querySelector('input[name="type"]:checked').value,total=sub()+fee(),m=`*NOVO PEDIDO — SONHO DE PASTEL*%0A*Pedido:* ${encodeURIComponent(code)}%0A%0A*Cliente:* ${encodeURIComponent($("name").value)}%0A*Telefone:* ${encodeURIComponent($("phone").value)}%0A*Tipo:* ${encodeURIComponent(t)}%0A`;if(t==="Entrega")m+=`*Endereço:* ${encodeURIComponent($("address").value)}%0A*Complemento:* ${encodeURIComponent($("complement").value)}%0A`;m+=`*Pagamento:* ${encodeURIComponent($("payment").value)}%0A%0A*ITENS:*%0A`;cart.forEach(x=>m+=`• ${x.qty}x ${encodeURIComponent(x.nome)} — ${encodeURIComponent(money(x.qty*Number(x.preco)))}%0A`);m+=`%0A*Subtotal:* ${encodeURIComponent(money(sub()))}%0A*Entrega:* ${encodeURIComponent(money(fee()))}%0A*TOTAL:* ${encodeURIComponent(money(total))}%0A`;if($("obs").value.trim())m+=`*Obs:* ${encodeURIComponent($("obs").value.trim())}`;window.open(`https://wa.me/${CONFIG.WHATSAPP}?text=${m}`,"_blank");$("send").disabled=false;$("send").textContent="📲 Confirmar e enviar no WhatsApp"}
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800)}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));update();load();
</script></body></html>
