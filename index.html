<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#481607">
<meta name="description" content="Cardápio oficial Sonho de Pastel">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">

<title>Sonho de Pastel | Cardápio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --b:#481607;
 --b2:#260a03;
 --y:#ffc400;
 --c:#fff8e8;
 --m:#76695e;
 --l:#eadccb;
 --g:#16a34a;
 --r:#c62828;
 --white:#fff;
}

*{
 box-sizing:border-box;
}

html{
 scroll-behavior:smooth;
}

body{
 margin:0;
 background:var(--c);
 color:#28180e;
 font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,
input,
select,
textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

button:disabled{
 opacity:.6;
 cursor:not-allowed;
}

/* ================= HEADER ================= */

.top{
 position:sticky;
 top:0;
 z-index:30;
 background:linear-gradient(135deg,var(--b),var(--b2));
 color:#fff;
 box-shadow:0 5px 20px #0003;
}

.topin{
 max-width:1180px;
 margin:auto;
 padding:9px 16px;
 display:flex;
 align-items:center;
 gap:12px;
}

.logo{
 width:52px;
 height:52px;
 object-fit:cover;
 border-radius:15px;
 background:#fff;
}

.brand b{
 display:block;
 font-size:19px;
}

.brand small{
 opacity:.72;
}

.cart{
 margin-left:auto;
 border:0;
 border-radius:999px;
 padding:11px 15px;
 background:var(--y);
 color:var(--b);
 font-weight:950;
}

.badge{
 display:inline-grid;
 place-items:center;
 min-width:23px;
 height:23px;
 padding:0 5px;
 background:var(--b);
 color:#fff;
 border-radius:50%;
}

/* ================= HERO ================= */

.hero{
 background:linear-gradient(135deg,#fff0a7,#fffaf1);
 padding:30px 16px;
}

.hero-in{
 max-width:1180px;
 margin:auto;
 display:grid;
 grid-template-columns:135px 1fr;
 gap:23px;
 align-items:center;
}

.hero img{
 width:135px;
 height:135px;
 object-fit:contain;
}

.hero h1{
 font-size:clamp(30px,5vw,48px);
 line-height:1;
 margin:0 0 10px;
 color:var(--b);
}

.hero p{
 margin:0 0 15px;
 color:#654e3e;
}

.search{
 width:min(700px,100%);
 padding:14px 18px;
 border:1px solid var(--l);
 border-radius:999px;
 outline:none;
 background:#fff;
}

.search:focus{
 border-color:var(--b);
 box-shadow:0 0 0 3px #48160718;
}

/* ================= CATEGORIES ================= */

.cats{
 position:sticky;
 top:70px;
 z-index:20;
 background:#fff;
 border-bottom:1px solid var(--l);
 overflow:auto;
}

.cats-in{
 max-width:1180px;
 margin:auto;
 padding:9px 16px;
 display:flex;
 gap:8px;
}

.cat{
 border:1px solid var(--l);
 background:#fff9f0;
 color:var(--b);
 border-radius:999px;
 padding:8px 14px;
 font-weight:850;
 white-space:nowrap;
}

.cat.on{
 background:var(--b);
 color:#fff;
}

/* ================= MAIN ================= */

main{
 max-width:1180px;
 margin:auto;
 padding:24px 16px 110px;
}

.status{
 text-align:center;
 padding:32px;
 color:var(--m);
}

.section{
 margin-bottom:30px;
}

.section h2{
 color:var(--b);
 font-size:24px;
 margin:0 0 14px;
}

/* ================= PRODUCT GRID ================= */

.grid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:16px;
}

.card{
 background:#fff;
 border:1px solid var(--l);
 border-radius:21px;
 overflow:hidden;
 box-shadow:0 12px 34px #4a170714;
 transition:.2s;
}

.card:hover{
 transform:translateY(-3px);
 box-shadow:0 15px 38px #4a170722;
}

.photo{
 height:215px;
 background:#f7ead6;
 position:relative;
 overflow:hidden;
}

.photo img{
 width:100%;
 height:100%;
 object-fit:cover;
 transition:.3s;
}

.card:hover .photo img{
 transform:scale(1.03);
}

.tag{
 position:absolute;
 left:11px;
 top:11px;
 background:var(--y);
 color:var(--b);
 padding:6px 9px;
 border-radius:999px;
 font-size:12px;
 font-weight:950;
}

.body{
 padding:14px;
 display:flex;
 flex-direction:column;
 min-height:175px;
}

.body h3{
 margin:0 0 6px;
}

.desc{
 font-size:14px;
 line-height:1.4;
 color:var(--m);
 min-height:40px;
}

.prodrow{
 margin-top:auto;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:8px;
}

.price{
 font-size:20px;
 font-weight:950;
 color:var(--b);
}

.add{
 border:0;
 background:var(--b);
 color:#fff;
 border-radius:11px;
 padding:10px 13px;
 font-weight:950;
}

.add:active{
 transform:scale(.97);
}

/* ================= STATUS CONNECTION ================= */

.connection{
 position:fixed;
 left:15px;
 bottom:17px;
 z-index:24;
 background:#fff;
 border:1px solid var(--l);
 border-radius:999px;
 padding:8px 12px;
 font-size:11px;
 font-weight:800;
 box-shadow:0 5px 20px #0002;
}

.connection.ok{
 color:var(--g);
}

.connection.error{
 color:var(--r);
}

/* ================= FAB ================= */

.fab{
 position:fixed;
 right:17px;
 bottom:17px;
 z-index:25;
 border:0;
 background:var(--g);
 color:#fff;
 border-radius:999px;
 padding:13px 17px;
 font-weight:950;
 box-shadow:0 8px 25px #0004;
 display:none;
}

.fab.show{
 display:block;
}

/* ================= OVERLAY ================= */

.overlay{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:60;
 display:none;
}

.overlay.open{
 display:block;
}

.drawer{
 position:absolute;
 right:0;
 top:0;
 height:100%;
 width:min(500px,100%);
 background:#fff;
 display:flex;
 flex-direction:column;
}

/* ================= CART HEADER ================= */

.head{
 padding:14px 17px;
 border-bottom:1px solid var(--l);
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.head h2{
 margin:0;
 color:var(--b);
}

.close{
 border:0;
 border-radius:50%;
 width:38px;
 height:38px;
 background:#f4eee6;
}

/* ================= STEPS ================= */

.steps{
 display:flex;
 padding:11px 15px;
 gap:6px;
 background:#fffaf4;
 border-bottom:1px solid var(--l);
}

.step{
 flex:1;
 text-align:center;
 font-size:10px;
 font-weight:950;
 color:#a09386;
}

.step.active{
 color:var(--b);
}

/* ================= PANES ================= */

.pane{
 display:none;
 flex:1;
 overflow:auto;
 padding:15px;
}

.pane.active{
 display:block;
}

/* ================= CART ITEMS ================= */

.item{
 display:grid;
 grid-template-columns:58px 1fr auto;
 gap:10px;
 align-items:center;
 padding:12px 0;
 border-bottom:1px solid #f0e7dc;
}

.item img{
 width:58px;
 height:58px;
 border-radius:12px;
 object-fit:cover;
}

.item b{
 font-size:14px;
}

.qty{
 display:flex;
 align-items:center;
 gap:6px;
 margin-top:5px;
}

.qty button{
 width:27px;
 height:27px;
 border:1px solid var(--l);
 background:#fff;
 border-radius:8px;
}

.rprice{
 font-weight:950;
 color:var(--b);
}

/* ================= FORM ================= */

.field{
 margin-bottom:11px;
}

.field label{
 display:block;
 font-size:11px;
 font-weight:950;
 color:#5e4b3c;
 margin-bottom:4px;
}

.field input,
.field select,
.field textarea{
 width:100%;
 padding:12px;
 border:1px solid var(--l);
 border-radius:12px;
 outline:none;
 background:#fff;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
 border-color:var(--b);
 box-shadow:0 0 0 3px #48160712;
}

.choices{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.choice{
 border:1px solid var(--l);
 border-radius:12px;
 padding:11px;
 font-weight:800;
}

.choice.selected{
 border:2px solid var(--b);
 background:#fff8eb;
}

/* ================= SUMMARY ================= */

.summary{
 background:#fff8ee;
 border-radius:14px;
 padding:13px;
 margin-top:12px;
}

.line{
 display:flex;
 justify-content:space-between;
 gap:10px;
 margin:6px 0;
}

.grand{
 border-top:1px solid var(--l);
 padding-top:9px;
 font-size:21px;
 font-weight:950;
 color:var(--b);
}

/* ================= BUTTONS ================= */

.bottom{
 border-top:1px solid var(--l);
 padding:12px 15px;
 background:#fff;
}

.btn{
 width:100%;
 border:0;
 border-radius:12px;
 padding:13px;
 font-weight:950;
}

.primary{
 background:var(--b);
 color:#fff;
}

.back{
 background:#f2eadf;
 color:var(--b);
 margin-top:7px;
}

.whats{
 background:var(--g);
 color:#fff;
 margin-top:7px;
}

/* ================= REVIEW ================= */

.review-card{
 background:#fffaf3;
 border:1px solid var(--l);
 border-radius:14px;
 padding:14px;
 margin-bottom:12px;
}

.review-title{
 font-weight:950;
 color:var(--b);
 margin-bottom:8px;
}

/* ================= TOAST ================= */

.toast{
 position:fixed;
 left:50%;
 bottom:20px;
 transform:translate(-50%,20px);
 background:#24140c;
 color:#fff;
 padding:11px 15px;
 border-radius:999px;
 opacity:0;
 z-index:100;
 transition:.2s;
 pointer-events:none;
}

.toast.show{
 opacity:1;
 transform:translate(-50%,0);
}

/* ================= ERROR ================= */

.error-box{
 background:#fff;
 border:1px solid #f1c7c7;
 border-radius:16px;
 padding:20px;
 color:#6d1b1b;
 text-align:left;
 max-width:650px;
 margin:20px auto;
}

.retry{
 margin-top:12px;
 border:0;
 background:var(--b);
 color:#fff;
 padding:11px 16px;
 border-radius:10px;
 font-weight:900;
}

/* ================= MOBILE ================= */

@media(max-width:850px){

 .grid{
  grid-template-columns:repeat(2,1fr);
 }

}

@media(max-width:600px){

 .hero-in{
  grid-template-columns:78px 1fr;
  gap:12px;
 }

 .hero img{
  width:78px;
  height:78px;
 }

 .hero h1{
  font-size:26px;
 }

 .grid{
  grid-template-columns:1fr 1fr;
  gap:10px;
 }

 .photo{
  height:150px;
 }

 .body{
  padding:11px;
  min-height:165px;
 }

 .body h3{
  font-size:16px;
 }

 .desc{
  font-size:12px;
 }

 .price{
  font-size:17px;
 }

 .add{
  padding:9px 10px;
 }

 .logo{
  width:46px;
  height:46px;
 }

 .brand b{
  font-size:16px;
 }

 .connection{
  bottom:72px;
  left:10px;
 }

}

@media(max-width:390px){

 .grid{
  grid-template-columns:1fr;
 }

 .photo{
  height:190px;
 }

 .choices{
  grid-template-columns:1fr;
 }

}
</style>
</head>

<body>

<!-- HEADER -->

<header class="top">

 <div class="topin">

  <img
   class="logo"
   src="logo.png"
   alt="Sonho de Pastel"
   onerror="this.src='icons/icon-192.png'"
  >

  <div class="brand">
   <b>Sonho de Pastel</b>
   <small>Cardápio oficial • Pedido pelo WhatsApp</small>
  </div>

  <button class="cart" onclick="openCart()">
   🛒 Carrinho
   <span class="badge" id="count">0</span>
  </button>

 </div>

</header>


<!-- HERO -->

<section class="hero">

 <div class="hero-in">

  <img
   src="logo.png"
   alt="Sonho de Pastel"
   onerror="this.src='icons/icon-192.png'"
  >

  <div>

   <h1>Seu pastel favorito 😋</h1>

   <p>
    Escolha seus produtos e finalize em poucos passos.
   </p>

   <input
    id="search"
    class="search"
    placeholder="🔎 Buscar no cardápio..."
    oninput="render()"
   >

  </div>

 </div>

</section>


<!-- CATEGORIAS -->

<nav class="cats">

 <div class="cats-in" id="cats"></div>

</nav>


<!-- MENU -->

<main>

 <div class="status" id="status">
  🔄 Conectando ao cardápio...
 </div>

 <div id="menu"></div>

</main>


<!-- CONNECTION STATUS -->

<div
 class="connection"
 id="connection"
>
 🔄 Conectando...
</div>


<!-- FLOATING CART -->

<button
 class="fab"
 id="fab"
 onclick="openCart()"
>
 🛒 Ver pedido ·
 <span id="fabTotal">R$ 0,00</span>
</button>


<!-- CHECKOUT -->

<div
 class="overlay"
 id="overlay"
 onclick="outside(event)"
>

 <aside class="drawer">

  <div class="head">

   <h2>🛒 Finalizar pedido</h2>

   <button
    class="close"
    onclick="closeCart()"
   >
    ✕
   </button>

  </div>


  <!-- STEPS -->

  <div class="steps">

   <div
    class="step active"
    id="s1"
   >
    1. ITENS
   </div>

   <div
    class="step"
    id="s2"
   >
    2. DADOS
   </div>

   <div
    class="step"
    id="s3"
   >
    3. REVISÃO
   </div>

  </div>


  <!-- STEP 1 -->

  <section
   class="pane active"
   id="pane1"
  >

   <div id="cartList"></div>

  </section>


  <!-- STEP 2 -->

  <section
   class="pane"
   id="pane2"
  >

   <div class="field">

    <label>NOME</label>

    <input
     id="name"
     autocomplete="name"
     placeholder="Seu nome"
    >

   </div>


   <div class="field">

    <label>TELEFONE</label>

    <input
     id="phone"
     autocomplete="tel"
     inputmode="tel"
     placeholder="(85) 99999-9999"
    >

   </div>


   <div class="field">

    <label>COMO VAI RECEBER?</label>

    <div class="choices">

     <label class="choice selected">

      <input
       type="radio"
       name="type"
       value="Entrega"
       checked
       onchange="calc()"
      >

      🛵 Entrega

     </label>


     <label class="choice">

      <input
       type="radio"
       name="type"
       value="Retirada"
       onchange="calc()"
      >

      🏪 Retirada

     </label>

    </div>

   </div>


   <div id="addressBox">

    <div class="field">

     <label>ENDEREÇO</label>

     <input
      id="address"
      autocomplete="street-address"
      placeholder="Rua, número, bairro"
     >

    </div>


    <div class="field">

     <label>COMPLEMENTO</label>

     <input
      id="complement"
      placeholder="Apartamento, ponto de referência"
     >

    </div>

   </div>


   <div class="field">

    <label>PAGAMENTO</label>

    <select id="payment">

     <option value="PIX">
      PIX
     </option>

     <option value="Dinheiro">
      Dinheiro
     </option>

     <option value="Cartão">
      Cartão
     </option>

    </select>

   </div>


   <div class="field">

    <label>OBSERVAÇÃO</label>

    <textarea
     id="obs"
     rows="3"
     placeholder="Ex.: sem cebola, molho à parte..."
    ></textarea>

   </div>

  </section>


  <!-- STEP 3 -->

  <section
   class="pane"
   id="pane3"
  >

   <div id="review"></div>

   <div class="summary">

    <div class="line">

     <span>Subtotal</span>

     <b id="subtotal">
      R$ 0,00
     </b>

    </div>


    <div class="line">

     <span>Entrega</span>

     <b id="delivery">
      R$ 0,00
     </b>

    </div>


    <div class="line grand">

     <span>Total</span>

     <span id="total">
      R$ 0,00
     </span>

    </div>

   </div>

  </section>


  <!-- BOTTOM -->

  <div class="bottom">

   <button
    class="btn primary"
    id="next"
    onclick="next()"
   >
    Continuar
   </button>


   <button
    class="btn back"
    id="back"
    style="display:none"
    onclick="back()"
   >
    Voltar
   </button>


   <button
    class="btn whats"
    id="send"
    style="display:none"
    onclick="finish()"
   >
    📲 Confirmar e enviar no WhatsApp
   </button>

  </div>

 </aside>

</div>


<!-- TOAST -->

<div
 class="toast"
 id="toast"
></div>


<script>

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const CONFIG={

 SUPABASE_URL:
 "https://htkqxttctkygzxubjhjy.supabase.co",

 SUPABASE_ANON_KEY:
 "sb_publishable_PvIjt7O1XsDIr1rs4fj99w_wcpcSA7L",

 TABLE:
 "produtos",

 BUCKET:
 "produtos",

 ORDERS_TABLE:
 "pedidos",

 WHATSAPP:
 "5585994530854",

 DELIVERY_FEE:
 5

};


/* =========================================================
   VARIÁVEIS
========================================================= */

let sb=null;

let products=[];

let cart=[];

let cat="Todos";

let step=1;


/* =========================================================
   HELPERS
========================================================= */

const $=x=>document.getElementById(x);


const money=v=>
 new Intl.NumberFormat(
  "pt-BR",
  {
   style:"currency",
   currency:"BRL"
  }
 ).format(Number(v)||0);


const esc=s=>
 String(s??"").replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m])
 );


/* =========================================================
   IMAGEM DO PRODUTO
========================================================= */

function img(p){

 if(p.imagem_url){

  return p.imagem_url;

 }

 if(
  sb &&
  p.imagem
 ){

  const result=
   sb.storage
    .from(CONFIG.BUCKET)
    .getPublicUrl(p.imagem);

  if(
   result &&
   result.data &&
   result.data.publicUrl
  ){

   return result.data.publicUrl;

  }

 }

 return "logo.png";

}


/* =========================================================
   STATUS DE CONEXÃO
========================================================= */

function connection(text,type){

 const el=$("connection");

 el.textContent=text;

 el.className="connection";

 if(type){

  el.classList.add(type);

 }

}


/* =========================================================
   CARREGAR SUPABASE
========================================================= */

async function load(){

 try{

  connection(
   "🔄 Conectando ao Supabase..."
  );


  if(!window.supabase){

   throw new Error(
    "A biblioteca do Supabase não carregou. Verifique sua conexão com a internet."
   );

  }


  if(
   !CONFIG.SUPABASE_URL ||
   !CONFIG.SUPABASE_ANON_KEY
  ){

   throw new Error(
    "SUPABASE_URL ou SUPABASE_ANON_KEY não configurado."
   );

  }


  sb=
   window.supabase.createClient(
    CONFIG.SUPABASE_URL,
    CONFIG.SUPABASE_ANON_KEY
   );


  console.log(
   "Supabase inicializado:",
   CONFIG.SUPABASE_URL
  );


  connection(
   "🔄 Buscando produtos..."
  );


  const r=
   await sb
    .from(CONFIG.TABLE)
    .select("*")
    .eq("ativo",true)
    .order(
     "ordem",
     {
      ascending:true
     }
    );


  console.log(
   "Resposta Supabase:",
   r
  );


  if(r.error){

   throw new Error(
    r.error.message+
    " | Código: "+
    (r.error.code||"N/A")
   );

  }


  products=r.data||[];


  if(!products.length){

   $("status").innerHTML=`
    <div class="error-box">
     <strong>⚠️ Nenhum produto encontrado.</strong>

     <p>
      A conexão com o Supabase funcionou,
      mas a tabela <b>produtos</b> não possui
      produtos ativos.
     </p>

     <button
      class="retry"
      onclick="load()"
     >
      🔄 Tentar novamente
     </button>
    </div>
   `;

   connection(
    "⚠️ 0 produtos",
    "error"
   );

   return;

  }


  $("status").style.display="none";


  connection(
   "🟢 Supabase conectado • "+
   products.length+
   " produtos",
   "ok"
  );


  cats();

  render();

  update();


  console.log(
   "Cardápio carregado:",
   products.length,
   "produtos"
  );


 }catch(error){

  console.error(
   "ERRO SUPABASE:",
   error
  );


  connection(
   "🔴 Erro Supabase",
   "error"
  );


  $("status").style.display="block";


  $("status").innerHTML=`

   <div class="error-box">

    <strong>
     ⚠️ Não foi possível carregar o cardápio
    </strong>

    <p>
     ${esc(error.message)}
    </p>

    <hr>

    <small>
     Possíveis causas:
     <br>• tabela <b>produtos</b> inexistente
     <br>• política RLS bloqueando SELECT
     <br>• chave ou URL incorreta
     <br>• problema de conexão
    </small>

    <br><br>

    <button
     class="retry"
     onclick="load()"
    >
     🔄 Tentar novamente
    </button>

   </div>

  `;

 }

}


/* =========================================================
   CATEGORIAS
========================================================= */

function cats(){

 const a=[
  "Todos",
  ...new Set(
   products.map(
    p=>p.categoria||"Outros"
   )
  )
 ];


 $("cats").innerHTML=
  a.map(
   c=>`

    <button
     class="cat ${c===cat?"on":""}"
     onclick='setcat(${JSON.stringify(c)})'
    >
     ${esc(c)}
    </button>

   `
  ).join("");

}


/* =========================================================
   SELECIONAR CATEGORIA
========================================================= */

function setcat(c){

 cat=c;

 cats();

 render();

}


/* =========================================================
   RENDER MENU
========================================================= */

function render(){

 const q=
  ($("search").value||"")
  .toLowerCase()
  .trim();


 const a=
  products.filter(
   p=>
    (
     cat==="Todos" ||
     (p.categoria||"Outros")===cat
    )
    &&
    (
     !q ||
     `${p.nome} ${p.descricao||""}`
      .toLowerCase()
      .includes(q)
    )
  );


 const g={};


 a.forEach(
  p=>
   (
    g[p.categoria||"Outros"]??=[]
   ).push(p)
 );


 $("menu").innerHTML=
  Object.keys(g).length

  ?

  Object.entries(g)
   .map(
    ([c,a])=>`

     <section class="section">

      <h2>
       ${esc(c)}
      </h2>

      <div class="grid">

       ${a.map(card).join("")}

      </div>

     </section>

    `
   )
   .join("")

  :

  `
   <div class="status">
    😕 Nenhum produto encontrado.
   </div>
  `;

}


/* =========================================================
   CARD DO PRODUTO
========================================================= */

function card(p){

 return `

  <article class="card">

   <div class="photo">

    <img
     loading="lazy"
     src="${esc(img(p))}"
     alt="${esc(p.nome)}"
     onerror="this.src='logo.png'"
    >

    ${
     p.destaque
     ?
     '<span class="tag">⭐ Destaque</span>'
     :
     ''
    }

   </div>


   <div class="body">

    <h3>
     ${esc(p.nome)}
    </h3>

    <div class="desc">
     ${esc(
      p.descricao ||
      "Preparado com carinho."
     )}
    </div>


    <div class="prodrow">

     <span class="price">
      ${money(p.preco)}
     </span>


     <button
      class="add"
      onclick="add('${String(p.id).replace(/'/g,"\\'")}')"
     >
      + Adicionar
     </button>

    </div>

   </div>

  </article>

 `;

}


/* =========================================================
   ADICIONAR AO CARRINHO
========================================================= */

function add(id){

 const p=
  products.find(
   x=>String(x.id)===id
  );


 if(!p)return;


 const x=
  cart.find(
   x=>String(x.id)===id
  );


 if(x){

  x.qty++;

 }else{

  cart.push({
   ...p,
   qty:1
  });

 }


 update();

 toast(
  p.nome+
  " adicionado ao carrinho 🛒"
 );

}


/* =========================================================
   ALTERAR QUANTIDADE
========================================================= */

function change(id,d){

 const i=
  cart.findIndex(
   x=>String(x.id)===String(id)
  );


 if(i<0)return;


 cart[i].qty+=d;


 if(cart[i].qty<=0){

  cart.splice(i,1);

 }


 update();

}


/* =========================================================
   SUBTOTAL
========================================================= */

function sub(){

 return cart.reduce(
  (s,x)=>
   s+
   x.qty*
   Number(x.preco),
  0
 );

}


/* =========================================================
   TAXA DE ENTREGA
========================================================= */

function fee(){

 const type=
  document.querySelector(
   'input[name="type"]:checked'
  )?.value;


 return
  type==="Entrega" &&
  cart.length
  ?
  Number(CONFIG.DELIVERY_FEE)
  :
  0;

}


/* =========================================================
   ATUALIZAR CARRINHO
========================================================= */

function update(){

 const count=
  cart.reduce(
   (s,x)=>s+x.qty,
   0
  );


 $("count").textContent=count;


 $("fabTotal").textContent=
  money(
   sub()+fee()
  );


 $("fab").classList.toggle(
  "show",
  cart.length>0
 );


 if(!cart.length){

  $("cartList").innerHTML=`

   <div class="status">
    Seu carrinho está vazio 😋
   </div>

  `;

 }else{

  $("cartList").innerHTML=

   cart.map(
    x=>`

     <div class="item">

      <img
       src="${esc(img(x))}"
       onerror="this.src='logo.png'"
      >

      <div>

       <b>
        ${esc(x.nome)}
       </b>

       <div class="qty">

        <button
         onclick="change('${x.id}',-1)"
        >
         −
        </button>

        <span>
         ${x.qty}
        </span>

        <button
         onclick="change('${x.id}',1)"
        >
         +
        </button>

       </div>

      </div>

      <span class="rprice">
       ${money(
        x.qty*
        Number(x.preco)
       )}
      </span>

     </div>

    `
   ).join("");

 }


 calc();

}


/* =========================================================
   CALCULAR TOTAL
========================================================= */

function calc(){

 $("subtotal").textContent=
  money(sub());


 $("delivery").textContent=
  money(fee());


 $("total").textContent=
  money(
   sub()+fee()
  );


 document
  .querySelectorAll(".choice")
  .forEach(
   x=>
    x.classList.toggle(
     "selected",
     x.querySelector("input").checked
    )
  );


 const type=
  document.querySelector(
   'input[name="type"]:checked'
  )?.value;


 $("addressBox").style.display=
  type==="Entrega"
  ?
  "block"
  :
  "none";


 $("fabTotal").textContent=
  money(
   sub()+fee()
  );

}


/* =========================================================
   ABRIR CARRINHO
========================================================= */

function openCart(){

 if(!cart.length){

  toast(
   "Adicione um produto primeiro."
  );

  return;

 }


 step=1;

 show();

 $("overlay")
  .classList
  .add("open");

}


/* =========================================================
   FECHAR CARRINHO
========================================================= */

function closeCart(){

 $("overlay")
  .classList
  .remove("open");

}


/* =========================================================
   CLICAR FORA
========================================================= */

function outside(e){

 if(
  e.target===
  $("overlay")
 ){

  closeCart();

 }

}


/* =========================================================
   MOSTRAR ETAPA
========================================================= */

function show(){

 [1,2,3].forEach(
  n=>{

   $("pane"+n)
    .classList
    .toggle(
     "active",
     n===step
    );


   $("s"+n)
    .classList
    .toggle(
     "active",
     n===step
    );

  }
 );


 $("next").style.display=
  step<3
  ?
  "block"
  :
  "none";


 $("back").style.display=
  step>1
  ?
  "block"
  :
  "none";


 $("send").style.display=
  step===3
  ?
  "block"
  :
  "none";


 if(step===3){

  review();

 }


 calc();

}


/* =========================================================
   PRÓXIMA ETAPA
========================================================= */

function next(){

 if(step===1){

  if(!cart.length){

   toast(
    "Seu carrinho está vazio."
   );

   return;

  }

  step=2;

  show();

  return;

 }


 if(
  step===2 &&
  validate()
 ){

  step=3;

  show();

 }

}


/* =========================================================
   VOLTAR
========================================================= */

function back(){

 if(step>1){

  step--;

  show();

 }

}


/* =========================================================
   VALIDAR FORMULÁRIO
========================================================= */

function validate(){

 if(
  !$("name").value.trim()
 ){

  toast(
   "Informe seu nome."
  );

  return false;

 }


 if(
  !$("phone").value.trim()
 ){

  toast(
   "Informe seu telefone."
  );

  return false;

 }


 const type=
  document.querySelector(
   'input[name="type"]:checked'
  ).value;


 if(
  type==="Entrega" &&
  !$("address").value.trim()
 ){

  toast(
   "Informe o endereço."
  );

  return false;

 }


 return true;

}


/* =========================================================
   REVISÃO
========================================================= */

function review(){

 const t=
  document.querySelector(
   'input[name="type"]:checked'
  ).value;


 $("review").innerHTML=`

  <div class="review-card">

   <div class="review-title">
    👤 Cliente
   </div>

   <div>
    <b>Nome:</b>
    ${esc($("name").value)}
   </div>

   <div>
    <b>Telefone:</b>
    ${esc($("phone").value)}
   </div>

  </div>


  <div class="review-card">

   <div class="review-title">
    📍 Entrega
   </div>

   <div>
    <b>Tipo:</b>
    ${esc(t)}
   </div>

   ${
    t==="Entrega"
    ?
    `
     <div>
      <b>Endereço:</b>
      ${esc($("address").value)}
     </div>

     <div>
      <b>Complemento:</b>
      ${esc($("complement").value)}
     </div>
    `
    :
    `
     <div>
      🏪 Retirada no estabelecimento
     </div>
    `
   }

  </div>


  <div class="review-card">

   <div class="review-title">
    💳 Pagamento
   </div>

   <div>
    ${esc($("payment").value)}
   </div>

  </div>


  <div class="review-card">

   <div class="review-title">
    🛒 Produtos
   </div>

   ${
    cart.map(
     x=>`

      <div class="line">

       <span>
        ${x.qty}x ${esc(x.nome)}
       </span>

       <b>
        ${money(
         x.qty*
         Number(x.preco)
        )}
       </b>

      </div>

     `
    ).join("")
   }

  </div>

 `;

}


/* =========================================================
   SALVAR PEDIDO NO SUPABASE
========================================================= */

async function save(){

 if(!sb){

  throw new Error(
   "Supabase não está conectado."
  );

 }


 const t=
  document.querySelector(
   'input[name="type"]:checked'
  ).value;


 const subtotal=
  sub();


 const taxa=
  fee();


 const total=
  subtotal+taxa;


 const pedido={

  cliente_nome:
   $("name").value.trim(),

  telefone:
   $("phone").value.trim(),

  tipo_pedido:
   t,

  endereco:
   t==="Entrega"
   ?
   $("address").value.trim()
   :
   null,

  complemento:
   $("complement").value.trim() ||
   null,

  pagamento:
   $("payment").value,

  observacao:
   $("obs").value.trim() ||
   null,

  itens:
   cart.map(
    x=>({
     produto_id:x.id,
     nome:x.nome,
     quantidade:x.qty,
     preco:Number(x.preco)
    })
   ),

  subtotal:
   subtotal,

  taxa_entrega:
   taxa,

  total:
   total,

  status:
   "novo"

 };


 console.log(
  "Enviando pedido:",
  pedido
 );


 const r=
  await sb
   .from(CONFIG.ORDERS_TABLE)
   .insert(pedido)
   .select("id")
   .single();


 if(r.error){

  console.error(
   "Erro ao salvar pedido:",
   r.error
  );

  throw new Error(
   r.error.message
  );

 }


 return r.data?.id;

}


/* =========================================================
   FINALIZAR
========================================================= */

async function finish(){

 if(!validate()){

  return;

 }


 if(!cart.length){

  toast(
   "Carrinho vazio."
  );

  return;

 }


 const send=$("send");


 send.disabled=true;

 send.textContent=
  "⏳ Salvando pedido...";


 try{

  let id=null;


  try{

   id=
    await save();

  }catch(dbError){

   console.error(
    "Pedido não salvo:",
    dbError
   );

   toast(
    "Não foi possível salvar no banco. O WhatsApp continuará."
   );

  }


  const code=
   id
   ||
   (
    "SP-"+
    Date.now()
     .toString()
     .slice(-6)
   );


  const t=
   document.querySelector(
    'input[name="type"]:checked'
   ).value;


  const total=
   sub()+fee();


  let message=
`*NOVO PEDIDO — SONHO DE PASTEL*

*Pedido:* ${code}

*Cliente:* ${$("name").value.trim()}
*Telefone:* ${$("phone").value.trim()}
*Tipo:* ${t}
`;


  if(t==="Entrega"){

   message+=
`*Endereço:* ${$("address").value.trim()}
*Complemento:* ${$("complement").value.trim() || "-"}
`;

  }


  message+=
`*Pagamento:* ${$("payment").value}

*ITENS:*
`;


  cart.forEach(
   x=>{

    message+=
`• ${x.qty}x ${x.nome} — ${money(x.qty*Number(x.preco))}
`;

   }
  );


  message+=
`
*Subtotal:* ${money(sub())}
*Entrega:* ${money(fee())}
*TOTAL:* ${money(total)}
`;


  if(
   $("obs").value.trim()
  ){

   message+=
`
*Observação:* ${$("obs").value.trim()}
`;

  }


  const whatsapp=
   "https://wa.me/"+
   CONFIG.WHATSAPP+
   "?text="+
   encodeURIComponent(message);


  window.open(
   whatsapp,
   "_blank"
  );


  toast(
   "Pedido preparado para o WhatsApp! 📲"
  );


  /*
   * Limpamos o carrinho somente depois
   * de preparar o pedido.
   */

  cart=[];

  update();

  setTimeout(
   closeCart,
   700
  );


 }catch(error){

  console.error(
   "Erro ao finalizar:",
   error
  );

  toast(
   "Erro ao finalizar pedido."
  );

 }finally{

  send.disabled=false;

  send.textContent=
   "📲 Confirmar e enviar no WhatsApp";

 }

}


/* =========================================================
   TOAST
========================================================= */

function toast(t){

 $("toast").textContent=t;

 $("toast")
  .classList
  .add("show");


 setTimeout(
  ()=>
   $("toast")
    .classList
    .remove("show"),
  2200
 );

}


/* =========================================================
   ERROS GLOBAIS
========================================================= */

window.addEventListener(
 "error",
 e=>{

  console.error(
   "ERRO JAVASCRIPT:",
   e.error ||
   e.message
  );

 }
);


/* =========================================================
   SERVICE WORKER
========================================================= */

if(
 "serviceWorker" in navigator
){

 window.addEventListener(
  "load",
  ()=>
   navigator.serviceWorker
    .register("sw.js")
    .catch(
     error=>
      console.warn(
       "Service Worker:",
       error
      )
    )
 );

}


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

update();

load();

</script>
