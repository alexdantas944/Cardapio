<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#571b07"><link rel="manifest" href="manifest.webmanifest?v=5">
<link rel="icon" href="icons/icon-192.png"><title>Sonho de Pastel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fffaf0;color:#32160c;font-family:system-ui,Arial}.top{background:#571b07;color:#fff;position:sticky;top:0;z-index:5}.topin{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:10px;align-items:center}.brand img{width:58px;height:58px;border-radius:15px}.brand b{font-size:20px}.brand small{display:block;color:#f5d6c6}.cart{background:#ffbf00;color:#4b1907;border:0;border-radius:28px;padding:12px 17px;font-weight:900}.count{background:#702507;color:#fff;border-radius:50%;padding:5px 10px;margin-left:5px}.hero{background:linear-gradient(135deg,#fff0a9,#fff9e8);padding:35px 16px}.heroin{max-width:1100px;margin:auto;display:flex;gap:22px;align-items:center}.hero img{width:115px;height:115px;object-fit:cover;border-radius:18px}.hero h1{font-size:clamp(32px,6vw,52px);margin:0}.hero p{font-size:20px;color:#6d594d}.search{width:100%;padding:15px 20px;border:1px solid #ddd0c2;border-radius:30px;font-size:18px}.status{max-width:1100px;margin:15px auto;padding:12px;text-align:center;background:#fff1d9;border-radius:12px}.ok{background:#eaf8ef!important;color:#116b35}.err{background:#fff0ef!important;color:#a3241b}.main{max-width:1100px;margin:auto;padding:18px 16px 80px}.cats{display:flex;gap:8px;overflow:auto;padding-bottom:15px}.cat{border:1px solid #eadfd0;background:#fff;border-radius:22px;padding:9px 14px;font-weight:800;white-space:nowrap}.cat.active{background:#571b07;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #eadfd0;border-radius:18px;overflow:hidden;box-shadow:0 8px 25px #32160c12}.pic{aspect-ratio:1.15;background:#f5e7d4;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:9px;left:9px;background:#ffbf00;padding:6px 9px;border-radius:15px;font-size:12px;font-weight:900}.body{padding:13px;display:flex;flex-direction:column;gap:7px}.body h3{margin:0}.body p{margin:0;color:#74685f;min-height:38px}.price{font-size:21px;font-weight:950;color:#571b07}.add,.primary{background:#571b07;color:#fff;border:0;border-radius:11px;padding:12px;font-weight:900}.empty{text-align:center;padding:45px 15px;color:#74685f}.drawer,.modal{position:fixed;inset:0;background:#0007;z-index:20;display:none}.show{display:block}.panel{position:absolute;right:0;top:0;height:100%;width:min(520px,100%);background:#fffaf4;display:flex;flex-direction:column}.head{padding:15px;border-bottom:1px solid #eadfd0;display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee5da;border-radius:50%;width:40px;height:40px}.items{overflow:auto;flex:1;padding:14px}.item{background:#fff;border:1px solid #eadfd0;border-radius:13px;padding:11px;margin-bottom:9px;display:flex;justify-content:space-between}.qty{display:flex;gap:7px;align-items:center;margin-top:7px}.qty button{border:0;background:#eadfd0;border-radius:7px;width:30px;height:30px}.foot{padding:15px;border-top:1px solid #eadfd0;background:#fff}.sum{display:flex;justify-content:space-between;margin:6px 0}.total{font-size:22px;font-weight:950}.primary{width:100%;margin-top:10px}.modal{align-items:flex-end;justify-content:center}.box{background:#fffaf4;width:min(680px,100%);max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;padding:17px}.form{display:grid;gap:11px}.field label{font-size:13px;font-weight:800;display:block;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ddd0c2;border-radius:10px}.field textarea{min-height:75px}.actions{display:flex;gap:9px}.actions button{flex:1;padding:13px;border:0;border-radius:11px;font-weight:900}.next{background:#138a45;color:#fff}.back{background:#eadfd0}.review{background:#fff;border:1px solid #eadfd0;border-radius:13px;padding:12px;line-height:1.55}
@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}.heroin{gap:14px}.hero img{width:90px;height:90px}.brand b{font-size:17px}.brand small{font-size:11px}}@media(max-width:480px){.grid{gap:9px}.body{padding:10px}.body h3{font-size:16px}.body p{font-size:12px}.price{font-size:18px}.hero h1{font-size:31px}}
</style></head><body>
<header class="top"><div class="topin"><div class="brand"><img src="logo.png"><div><b>Sonho de Pastel</b><small>Cardápio oficial • Pedido pelo WhatsApp</small></div></div><button class="cart" onclick="openCart()">🛒 Carrinho <span class="count" id="count">0</span></button></div></header>
<section class="hero"><div class="heroin"><img src="logo.png"><div><h1>Seu pastel favorito 😊</h1><p>Escolha seus produtos e finalize em poucos passos.</p><input id="search" class="search" placeholder="🔎 Buscar no cardápio..." oninput="render()"></div></div></section>
<div id="status" class="status">🔄 Conectando ao Supabase...</div><main class="main"><div id="cats" class="cats"></div><div id="grid" class="grid"></div></main>
<div id="drawer" class="drawer" onclick="if(event.target===this)closeCart()"><div class="panel"><div class="head"><h2>🛒 Carrinho</h2><button class="close" onclick="closeCart()">✕</button></div><div id="items" class="items"></div><div class="foot"><div class="sum"><span>Subtotal</span><b id="sub">R$ 0,00</b></div><div class="sum"><span>Entrega</span><b id="fee">R$ 5,00</b></div><div class="sum total"><span>Total</span><b id="tot">R$ 5,00</b></div><button class="primary" onclick="checkout()">Continuar pedido</button></div></div></div>
<div id="modal" class="modal"><div class="box"><div class="head" style="padding:0 0 12px"><h2>Finalizar pedido</h2><button class="close" onclick="closeCheckout()">✕</button></div><div id="form"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const CONFIG={SUPABASE_URL:"https://htkqxttctkygzxubjhjy.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_PvIjt7O1XsDIr1rs4fj99w_wcpcSA7L",TABLE:"produtos",BUCKET:"produtos",ORDERS_TABLE:"pedidos",WHATSAPP:"5585994530854",DELIVERY_FEE:5};
let sb,products=[],cart=[],cat="Todos",step=1;const $=x=>document.getElementById(x),money=n=>Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function stat(t,c=""){ $("status").textContent=t;$("status").className="status "+c}
function productImg(p){if(p.imagem_url)return p.imagem_url;if(sb&&p.imagem){let r=sb.storage.from(CONFIG.BUCKET).getPublicUrl(p.imagem);if(r.data?.publicUrl)return r.data.publicUrl}return"logo.png"}
async function load(){try{stat("🔄 Conectando ao Supabase...");if(!window.supabase)throw Error("Biblioteca Supabase não carregou.");sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);let r=await sb.from(CONFIG.TABLE).select("*").eq("ativo",true).order("ordem",{ascending:true});if(r.error)throw r.error;products=(r.data||[]).map(p=>({...p,preco:Number(p.preco||0),categoria:p.categoria||"Outros"}));if(!products.length){stat("⚠️ Supabase conectado, mas a tabela produtos está vazia.","err");$("grid").innerHTML='<div class="empty" style="grid-column:1/-1">Nenhum produto cadastrado. Execute o SQL do ZIP.</div>';cats();update();return}stat("🟢 Supabase conectado • "+products.length+" produtos","ok");cats();render();update()}catch(e){console.error(e);stat("❌ Erro no Supabase: "+(e.message||e),"err");$("grid").innerHTML='<div class="empty" style="grid-column:1/-1"><b>Não foi possível carregar o cardápio.</b><br><br>'+esc(e.message||e)+'<br><br><button class="primary" onclick="load()">🔄 Tentar novamente</button></div>'}}
function cats(){let a=["Todos",...new Set(products.map(p=>p.categoria))];$("cats").innerHTML=a.map(c=>'<button class="cat '+(cat===c?"active":"")+'" onclick="cat='+JSON.stringify(c)+';cats();render()">'+esc(c)+"</button>").join("")}
function render(){let q=$("search").value.toLowerCase(),a=products.filter(p=>(cat==="Todos"||p.categoria===cat)&&(!q||(p.nome+" "+(p.descricao||"")+" "+p.categoria).toLowerCase().includes(q)));$("grid").innerHTML=a.length?a.map(p=>'<article class="card"><div class="pic"><img src="'+esc(productImg(p))+'" onerror="this.src=\'logo.png\'" loading="lazy">'+(p.destaque?'<span class="badge">⭐ Destaque</span>':"")+'</div><div class="body"><h3>'+esc(p.nome)+'</h3><p>'+esc(p.descricao||"Delicioso e preparado com carinho.")+'</p><div class="price">'+money(p.preco)+'</div><button class="add" onclick="add('+p.id+')">+ Adicionar</button></div></article>').join(""):'<div class="empty" style="grid-column:1/-1">🔎 Nenhum produto encontrado.</div>'}
function add(id){let p=products.find(x=>x.id==id),i=cart.find(x=>x.id==id);if(i)i.q++;else cart.push({id:p.id,nome:p.nome,preco:p.preco,q:1});update()}
function change(id,d){let i=cart.find(x=>x.id==id);if(!i)return;i.q+=d;if(i.q<1)cart=cart.filter(x=>x.id!=id);update()}
function totals(){let s=cart.reduce((a,i)=>a+i.preco*i.q,0);return{s,fee:s?CONFIG.DELIVERY_FEE:0,total:s+(s?CONFIG.DELIVERY_FEE:0)}}
function update(){let n=cart.reduce((a,i)=>a+i.q,0),t=totals();$("count").textContent=n;$("sub").textContent=money(t.s);$("fee").textContent=money(t.fee);$("tot").textContent=money(t.total);$("items").innerHTML=cart.length?cart.map(i=>'<div class="item"><div><b>'+esc(i.nome)+'</b><small>'+money(i.preco)+' cada</small><div class="qty"><button onclick="change('+i.id+',-1)">−</button><b>'+i.q+'</b><button onclick="change('+i.id+',1)">+</button></div></div><b>'+money(i.preco*i.q)+'</b></div>').join(""):'<div class="empty">Seu carrinho está vazio.</div>'}
function openCart(){$("drawer").classList.add("show")}function closeCart(){$("drawer").classList.remove("show")}
function checkout(){if(!cart.length)return alert("Adicione produtos ao carrinho.");closeCart();step=1;renderForm();$("modal").style.display="flex"}
function closeCheckout(){$("modal").style.display="none"}
function renderForm(){let t=totals();if(step===1)$("form").innerHTML='<div class="form"><div class="field"><label>Nome *</label><input id="nome" placeholder="Seu nome"></div><div class="field"><label>Telefone *</label><input id="tel" inputmode="tel" placeholder="(85) 99999-9999"></div><div class="field"><label>Recebimento</label><select id="tipo" onchange="toggle()"><option>Entrega</option><option>Retirada</option></select></div><div id="addr"><div class="field"><label>Endereço *</label><input id="end" placeholder="Rua, número, bairro"></div><div class="field"><label>Complemento</label><input id="comp" placeholder="Apto, referência..."></div></div><div class="actions"><button class="back" onclick="closeCheckout()">Cancelar</button><button class="next" onclick="next()">Continuar →</button></div></div>';else if(step===2)$("form").innerHTML='<div class="form"><div class="field"><label>Pagamento</label><select id="pag"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select></div><div class="field"><label>Observação</label><textarea id="obs" placeholder="Troco, retirar ingrediente..."></textarea></div><div class="review">'+cart.map(i=>i.q+"x "+esc(i.nome)+" — "+money(i.preco*i.q)).join("<br>")+"<hr><b>Total: "+money(t.total)+"</b></div><div class="actions"><button class="back" onclick="step=1;renderForm()">← Voltar</button><button class="next" onclick="next()">Revisar →</button></div></div>';else{$("form").innerHTML='<div class="form"><div class="review"><b>Confira seu pedido</b><br><br>'+cart.map(i=>i.q+"x "+esc(i.nome)+" — "+money(i.preco*i.q)).join("<br>")+"<hr><b>Total: "+money(t.total)+"</b></div><div class="actions"><button class="back" onclick="step=2;renderForm()">← Voltar</button><button class="next" onclick="sendOrder()">✅ Enviar para WhatsApp</button></div></div>"}}
function toggle(){$("addr").style.display=$("tipo").value==="Entrega"?"block":"none"}
function next(){if(step===1&&(!$("nome").value.trim()||!$("tel").value.trim()||($("tipo").value==="Entrega"&&!$("end").value.trim())))return alert("Preencha os campos obrigatórios.");step++;renderForm()}
async function sendOrder(){let nome=$("nome")?.value||"",tel=$("tel")?.value||"",tipo=$("tipo")?.value||"Entrega",end=$("end")?.value||"",comp=$("comp")?.value||"",pag=$("pag")?.value||"Pix",obs=$("obs")?.value||"",t=totals(),id="WEB-"+Date.now();let payload={cliente_nome:nome,cliente_telefone:tel,tipo_entrega:tipo,endereco:end,complemento:comp,pagamento:pag,observacao:obs,itens:cart,subtotal:t.s,taxa_entrega:t.fee,total:t.total,status:"novo"};try{let r=await sb.from(CONFIG.ORDERS_TABLE).insert(payload).select("id").single();if(!r.error&&r.data?.id)id=r.data.id;else console.warn(r.error)}catch(e){console.warn(e)}let lines=cart.map(i=>i.q+"x "+i.nome+" — "+money(i.preco*i.q)).join("\n");let addr=tipo==="Entrega"?end+(comp?", "+comp:""):"Retirada no local";let msg="*NOVO PEDIDO — SONHO DE PASTEL*\nPedido: "+id+"\nCliente: "+nome+"\nTelefone: "+tel+"\nRecebimento: "+tipo+"\nEndereço: "+addr+"\nPagamento: "+pag+"\n\n*ITENS*\n"+lines+"\n\nSubtotal: "+money(t.s)+"\nEntrega: "+money(t.fee)+"\n*TOTAL: "+money(t.total)+(obs?"\nObs.: "+obs:"");window.open("https://wa.me/"+CONFIG.WHATSAPP+"?text="+encodeURIComponent(msg),"_blank");closeCheckout()}
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js?v=5").catch(console.warn));load();
</script></body></html>
